name: release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install Poetry
        run: pipx install "poetry==2.1.*"

      - name: Install dependencies with Poetry
        run: poetry install --no-interaction --with test

      - name: Run tests that do not use LLMs
        run: poetry run pytest --cov=graphrag_eval --cov-report=term-missing tests/

      - name: Install dependencies, including LLM and Ragas dependencies, using Poetry
        run: poetry install --no-interaction --with llm

      - name: Run tests that use LLMs
        run: poetry run pytest --cov=graphrag_eval --cov-report=term-missing tests-with-llm/

      - name: Run system tests that use LLMs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_GENERATION_KEY: ${{ secrets.AZURE_OPENAI_GENERATION_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_EMBEDDING_KEY: ${{ secrets.AZURE_OPENAI_EMBEDDING_KEY }}
        run: poetry run pytest system-tests/*.py

      - name: Build package
        run: poetry build

      - name: Publish to TestPyPI
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          poetry config repositories.testpypi https://test.pypi.org/legacy/
          poetry publish -r testpypi --no-interaction --username __token__ --password $TEST_PYPI_TOKEN

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --no-interaction --username __token__ --password $PYPI_TOKEN
